name: Build CARAXES Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Expand CARAXES source bundle
        run: Expand-Archive -Path CARAXES.zip -DestinationPath . -Force

      - name: Download offline wake-word model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path caraxes-os/models | Out-Null
          Invoke-WebRequest -Uri https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -OutFile vosk-model.zip
          Expand-Archive -Path vosk-model.zip -DestinationPath caraxes-os/models -Force
          Remove-Item vosk-model.zip -Force

      - name: Build frontend
        working-directory: caraxes-os/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r caraxes-os/desktop-requirements.txt

      - name: Package portable Windows app
        working-directory: caraxes-os
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name CARAXES
          --add-data "frontend/dist;frontend/dist"
          --add-data "models/vosk-model-small-en-us-0.15;models/vosk-model-small-en-us-0.15"
          --collect-all webview --collect-all clr_loader
          --collect-all vosk --collect-all sounddevice --collect-all numpy
          --collect-all _sounddevice_data
          --hidden-import pythonnet
          --hidden-import _sounddevice_data
          --hidden-import scripts.wake_listener
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.lifespan.on
          desktop.py

      - name: Upload CARAXES executable
        uses: actions/upload-artifact@v4
        with:
          name: CARAXES-Windows-x64
          path: caraxes-os/dist/CARAXES.exe
          if-no-files-found: error
          retention-days: 30
